services:
  - type: web
    runtime: static
    name: wedding-calculator
    buildCommand: npm ci && npm run build -- --webpack
    staticPublishPath: ./out
    domains:
      - weddingbudget.co.kr
    renderSubdomainPolicy: disabled
    routes:
      - type: redirect
        source: /calculators
        destination: /calculators/
      - type: redirect
        source: /calculators/*
        destination: /calculators/*/
      - type: redirect
        source: /guides
        destination: /guides/
      - type: redirect
        source: /guides/*
        destination: /guides/*/
      - type: redirect
        source: /summary
        destination: /summary/
      - type: redirect
        source: /methodology
        destination: /methodology/
      - type: redirect
        source: /privacy
        destination: /privacy/
      - type: redirect
        source: /disclaimer
        destination: /disclaimer/
      - type: redirect
        source: /terms
        destination: /terms/
      - type: redirect
        source: /contact
        destination: /contact/
    headers:
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; frame-src https:"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-DNS-Prefetch-Control
        value: "on"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Origin-Agent-Cluster
        value: "?1"
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: X-XSS-Protection
        value: "0"
      - path: /summary
        name: X-Robots-Tag
        value: "noindex, follow"
      - path: /summary/*
        name: X-Robots-Tag
        value: "noindex, follow"
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://weddingbudget.co.kr"
      - key: NEXT_PUBLIC_ADSENSE_CLIENT_ID
        value: ""
      - key: NEXT_PUBLIC_ADSENSE_APPROVED
        value: "false"
      - key: NEXT_PUBLIC_AD_SLOT_TOP
        value: ""
      - key: NEXT_PUBLIC_AD_SLOT_CONTENT
        value: ""
      - key: NEXT_PUBLIC_AD_SLOT_RESULT
        value: ""
      - key: AFFILIATE_WEDDING_HALL_URL
        value: "#"
      - key: AFFILIATE_STUDIO_DRESS_MAKEUP_URL
        value: "#"
      - key: AFFILIATE_HOME_APPLIANCE_URL
        value: "#"
      - key: AFFILIATE_HONEYMOON_URL
        value: "#"
      - key: AFFILIATE_CLEANING_URL
        value: "#"
      - key: AFFILIATE_INTERNET_URL
        value: "#"
