services:
  - type: web
    runtime: node
    name: wedding-calculator
    buildCommand: npm ci && npm run build -- --webpack
    startCommand: npm run start
    domains:
      - weddingbudget.co.kr
    renderSubdomainPolicy: disabled
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://weddingbudget.co.kr"
      - key: NEXT_PUBLIC_ADFIT_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_ADFIT_ALLOWED_HOSTS
        value: "weddingbudget.co.kr,www.weddingbudget.co.kr"
      - key: NEXT_PUBLIC_ADFIT_CALC_SECONDARY_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_ADFIT_CALC_ENTRY_M_320X100
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALC_ENTRY_D_728X90
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALC_ENTRY_D_300X250
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALC_PRIMARY_M_320X100
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALC_PRIMARY_D_728X90
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALC_PRIMARY_D_300X250
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALC_SECONDARY_M_300X250
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALC_SECONDARY_D_300X250
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALCULATOR_HUB_M_320X100
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_CALCULATOR_HUB_D_728X90
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_HOME_AFTER_SITUATIONS_M_320X100
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_HOME_AFTER_SITUATIONS_D_728X90
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_GUIDE_HUB_M_320X100
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_GUIDE_HUB_D_728X90
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_GUIDE_MID_M_300X250
        value: "DAN-REPLACE-ME"
      - key: NEXT_PUBLIC_ADFIT_GUIDE_MID_D_300X250
        value: "DAN-REPLACE-ME"
      - key: AFFILIATE_WEDDING_HALL_URL
        value: "#"
      - key: AFFILIATE_STUDIO_DRESS_MAKEUP_URL
        value: "#"
      - key: AFFILIATE_HOME_APPLIANCE_URL
        value: "#"
      - key: AFFILIATE_HONEYMOON_URL
        value: "#"
      - key: AFFILIATE_CLEANING_URL
        value: "#"
      - key: AFFILIATE_INTERNET_URL
        value: "#"
